name: Web image

# Builds the marketing site (apps/web, Next.js standalone) into a container image and publishes it to the GitHub
# Container Registry as ghcr.io/aieasycep/dijitalasistanim-web. The OVH host pulls it (deploy/ovh/docker-compose.yml).
# Tags: sha-<7 chars> for every build, <branch> for branch heads, latest for main.
# NEXT_PUBLIC_* values are inlined at build time and come from repository variables (Settings → Secrets and
# variables → Actions → Variables): NEXT_PUBLIC_WEB_URL, NEXT_PUBLIC_APP_STORE_URL, NEXT_PUBLIC_PLAY_STORE_URL,
# NEXT_PUBLIC_TRIAL_DAYS — all optional, the app has defaults. Contact addresses and the app-link values are read at
# run time from deploy/ovh/.env.

on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'apps/web/**'
      - 'packages/design-tokens/**'
      - 'packages/domain/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - 'tsconfig.base.json'
      - '.dockerignore'
      - '.github/workflows/web-image.yml'

concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aieasycep/dijitalasistanim-web

jobs:
  image:
    name: Build & push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_WEB_URL=${{ vars.NEXT_PUBLIC_WEB_URL || 'https://dijitalasistan.app' }}
            NEXT_PUBLIC_APP_STORE_URL=${{ vars.NEXT_PUBLIC_APP_STORE_URL }}
            NEXT_PUBLIC_PLAY_STORE_URL=${{ vars.NEXT_PUBLIC_PLAY_STORE_URL }}
            NEXT_PUBLIC_TRIAL_DAYS=${{ vars.NEXT_PUBLIC_TRIAL_DAYS }}
      - name: Summary
        run: |
          {
            echo "## Web image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "On the server: set \`WEB_IMAGE_TAG\` in deploy/ovh/.env (or keep \`latest\`), then"
            echo '`docker compose pull && docker compose up -d`.'
          } >> "$GITHUB_STEP_SUMMARY"
